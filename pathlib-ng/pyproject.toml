[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathlib-ng"
version = "0.1.0"
description = "A lightweight, drop-in replacement for `pathlib.Path` with enhanced features, better error messages, and zero external dependencies"
readme = "README.md"
requires-python = ">=3.6"
license = "MIT"
authors = [
    {name = "Fkernel653"}
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.hatch.build.targets.wheel]
packages = ["pathlib_ng"]
